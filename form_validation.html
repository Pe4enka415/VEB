<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма с валидацией</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <h1>Форма обратной связи</h1>
        
        <form id="contactForm">
            <div class="form-group">
                <label for="username">Ваше имя:</label>
                <input type="text" id="username" name="username" placeholder="Введите имя">
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Подтверждение пароля:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль">
            </div>

            <div class="form-group">
                <label for="email">Электронный адрес:</label>
                <input type="text" id="email" name="email" placeholder="example@mail.com">
            </div>

            <div class="form-group">
                <label for="subject">Тема сообщения:</label>
                <input type="text" id="subject" name="subject" placeholder="Тема">
            </div>

            <div class="form-group">
                <label for="message">Сообщение:</label>
                <textarea id="message" name="message" rows="5" placeholder="Введите текст сообщения"></textarea>
            </div>

            <div class="buttons">
                <button type="submit">Отправить</button>
                <button type="reset">Очистить</button>
            </div>
        </form>

        <div id="result" style="display:none;">
            <h3>Результат проверки</h3>
            <p id="resultContent"></p>
        </div>
    </div>

    <script src="validation_script.js"></script>
</body>
</html>
