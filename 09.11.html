<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цветная сетка</title>
<body>
    <table>
        <script>
            int n = 10;
            for (int i =0;i<n;i++)
            {
                for (int j =0;j<n;j++)
                {
                    if (i+j>=n-1) tr(background: "red")
                    else tr(background: "blue");
                }
            }
        </script>
    </table>

</body>
</html>
