<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8>
      <title>Круглый div</title>
      <style>
      .circle_red
      {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        position: absolute;
        background: "red";
      }
      .circle_yellow
      {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        position: absolute;
        background: "yellow";
      }
      .circle_green
      {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        position: absolute;
        background: "green";
      }
      </style>
  </head>
  <body>
    <iframe src="menu.html" style="border:none; width:100%; height:55px; display:block;" sandbox="allow-scripts allow-top-navigation allow-same-origin"></iframe>
    <div class="circle_red" id="circle_red" style="top: 200px">
    </div>
    <div class="circle_yellow" id="circle_yellow" style="top: 200px">
    </div>
    <div class="circle_green" id="circle_green" style="top: 200px">
    </div>
  </body>
</html>
