<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Практическая работа №1 — Список</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <iframe src="menu.html" style="border:none; width:100%; height:55px; display:block;" sandbox="allow-scripts allow-top-navigation allow-same-origin"></iframe>

    <div class="page">
        <h1>СПИСОК ЛЮДЕЙ</h1>

        <div class="buttons">
            <button type="button" onclick="showList()">Показать список</button>
        </div>

        <div id="peopleList" style="margin-top: 20px; display: none;">
            <h3>Список людей:</h3>
            <ol id="peopleListContent"></ol>
        </div>
    </div>

    <script>
        const people = [
            'Арасланов Василий — студент группы 24П-1',
            'Костромин Андрей — студент группы 24П-1',
            'Чураков Павел — студентка группы 24П-1',
            'Касьянов Роман — студент группы 24П-1'
        ];

        function showList() {
            let html = '';
            for (let i = 0; i < people.length; i++) {
                html += '<li>' + people[i] + '</li>';
            }
            document.getElementById('peopleListContent').innerHTML = html;
            document.getElementById('peopleList').style.display = 'block';
        }
    </script>
</body>
</html>
