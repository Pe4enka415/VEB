<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета</title>
</head>
<body>

    <h1>АНКЕТА</h1>

    <!-- Форма -->
    <form id="surveyForm">
        
        <div class="form-group">
            <label for="name">Ваше имя</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label>Ваш пол</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="женский"> женский</label>
                <label><input type="radio" name="gender" value="мужской"> мужской</label>
            </div>
        </div>

        <div class="form-group">
            <label for="course">На каком курсе вы учитесь?</label>
            <select id="course" name="course">
                <option value="первый">первый</option>
                <option value="второй">второй</option>
                <option value="третий">третий</option>
                <option value="четвертый">четвертый</option>
                <option value="пятый">пятый</option>
            </select>
        </div>

        <div class="form-group">
            <label>Какие языки программирования вы знаете?</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="lang" value="Паскаль"> Паскаль</label><br>
                <label><input type="checkbox" name="lang" value="СИ"> СИ</label><br>
                <label><input type="checkbox" name="lang" value="Ассемблер"> Ассемблер</label>
            </div>
        </div>

        <div class="form-group">
            <label for="about">Напишите несколько слов о себе</label>
            <br>
            <textarea id="about" name="about"></textarea>
        </div>

        <div class="buttons">
            <button type="submit">Отправка данных</button>
            <button type="reset">Сброс значений полей</button>
        </div>
    </form>

    <!-- Блок для вывода информации -->
    <div id="result">
        <h3>Данные успешно отправлены:</h3>
        <div id="resultContent"></div>
    </div>

    <!-- Подключаем внешний JavaScript-файл -->
    <script src="script.js"></script>

</body>
</html>
