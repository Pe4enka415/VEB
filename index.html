<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета</title>
</head>
<body>

    <h1>АНКЕТА</h1>

    <!-- Форма -->
    <form id="surveyForm">
        
        <div class="form-group">
            <label for="name">Ваше имя</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label>Ваш пол</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="женский"> женский</label>
                <label><input type="radio" name="gender" value="мужской"> мужской</label>
            </div>
        </div>

        <div class="form-group">
            <label for="course">На каком курсе вы учитесь?</label>
            <select id="course" name="course">
                <option value="первый">первый</option>
                <option value="второй">второй</option>
                <option value="третий">третий</option>
                <option value="четвертый">четвертый</option>
                <option value="пятый">пятый</option>
            </select>
        </div>

        <div class="form-group">
            <label>Какие языки программирования вы знаете?</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="lang" value="Паскаль"> Паскаль</label><br>
                <label><input type="checkbox" name="lang" value="СИ"> СИ</label><br>
                <label><input type="checkbox" name="lang" value="Ассемблер"> Ассемблер</label>
            </div>
        </div>

        <div class="form-group">
            <label for="about">Напишите несколько слов о себе</label>
<br>
            <textarea id="about" name="about"></textarea>
        </div>

        <div class="buttons">
            <button type="submit">Отправка данных</button>
            <button type="reset">Сброс значений полей</button>
        </div>
    </form>

    <!-- Блок для вывода информации -->
    <div id="result">
        <h3>Данные успешно отправлены:</h3>
        <div id="resultContent"></div>
    </div>

    <script>
        // Находим форму и блок для вывода
        const form = document.getElementById('surveyForm');
        const resultDiv = document.getElementById('result');
        const resultContent = document.getElementById('resultContent');

        // Слушаем событие отправки формы
        form.addEventListener('submit', function(event) {
            // Предотвращаем перезагрузку страницы (стандартное поведение формы)
            event.preventDefault();

            // Собираем данные из полей
            const name = document.getElementById('name').value;
            const course = document.getElementById('course').value;
            const about = document.getElementById('about').value;
            
            // Собираем выбранный пол (радиокнопки)
            let gender = "Не указан";
            const genderRadios = document.getElementsByName('gender');
            for (let radio of genderRadios) {
                if (radio.checked) {
                    gender = radio.value;
                    break;
                }
            }

            // Собираем выбранные языки (чекбоксы)
            let languages = [];
            const langCheckboxes = document.getElementsByName('lang');
            for (let checkbox of langCheckboxes) {
                if (checkbox.checked) {
                    languages.push(checkbox.value);
                }
            }
            // Если ничего не выбрано, пишем "Нет"
            const langString = languages.length > 0 ? languages.join(', ') : 'Не выбрано';

            // Формируем HTML для вывода
            // Используем textContent или экранирование, чтобы избежать XSS, но для примера сойдет и innerHTML
            resultContent.innerHTML = `
                <p><strong>Имя:</strong> ${name}</p>
                <p><strong>Пол:</strong> ${gender}</p>
                <p><strong>Курс:</strong> ${course}</p>
                <p><strong>Языки программирования:</strong> ${langString}</p>
                <p><strong>О себе:</strong> ${about}</p>
            `;

            // Показываем блок с результатом
            resultDiv.style.display = 'block';

            // Опционально: можно очистить форму после отправки
            // form.reset(); 
            // Но обычно при сбросе результаты пропадают, поэтому оставим как есть или раскомментируем по желанию.
        });

        // Обработка кнопки сброса (опционально, чтобы скрыть блок результата при сбросе)
        form.addEventListener('reset', function() {
            resultDiv.style.display = 'none';
            resultContent.innerHTML = '';
        });
    </script>

</body>
</html>
