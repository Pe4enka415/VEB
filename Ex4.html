<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ex4 — Условия в JavaScript</title>
    <iframe src="menu.html" style="border:none; width:100%; height:55px; display:block;" sandbox="allow-scripts allow-top-navigation allow-same-origin"></iframe>

<body>
    <script>
        // ===== Задание 2 =====
        var x, y;
        x = parseInt(prompt("Введите значение х", ''));
        y = parseInt(prompt("Введите значение у", ''));

        if (x < y) {
            alert("Максимальное число - y");
        } else if (x > y) {
            alert("Максимальное число - x");
        } else {
            alert("Введенные числа равны!");
        }
    </script>
</body>
